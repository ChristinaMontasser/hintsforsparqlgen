system_message: |
  <prompt>
    <role> You are an expert SPARQL query generator. </role>

    <task> Your task is to generate a syntactically valid query in SPARQL 1.1, based on the natural language question. </task>

  </prompt>

tag_blocks:
  general_constraints: |
    <general_constraints>
      - Generate ONLY ONE SELECT query.
      - Output ONLY the SPARQL query.
      - Do NOT include explanations, comments, or markdown.
      - Do NOT repeat the generation.
      - Never invent classes, properties, IRIs, or prefixes such as http://example.org. 
      - Every prefixed name appearing in the generated SPARQL query must have a corresponding PREFIX declaration. Include only the prefixes that are actually used in the SPARQL query.
    </general_constraints>

  schema_general_constraints: |
    <schema>
      - Use ONLY the entities and properties provided in the schema. Do not invent your own.
    </schema>

  reasoning_path_general_constraints: |
    <reasoning_path>
      - Use ONLY the entities and properties provided in the reasoning path and the direction implied by the path.
    </reasoning_path>

  prefix_declaration: |
    <prefix_declaration>
      PREFIX dcat: <http://www.w3.org/ns/dcat#> 
      PREFIX dct: <http://purl.org/dc/terms/> 
      PREFIX doap: <http://usefulinc.com/ns/doap#> 
      PREFIX foaf: <http://xmlns.com/foaf/0.1/> 
      PREFIX geo: <http://www.opengis.net/ont/geosparql#> 
      PREFIX linkml: <https://w3id.org/linkml/> 
      PREFIX n4e: <http://nfdi4earth.de/ontology/> 
      PREFIX n4evc: <https://nfdi4earth.pages.rwth-aachen.de/knowledgehub/nfdi4earth-kh-schema/controlled-vocabulary/> 
      PREFIX ns1: <http://www.loc.gov/premis/rdf/v3/> 
      PREFIX obo: <http://purl.obolibrary.org/obo/> 
      PREFIX ogcdef: <http://www.opengis.net/def/serviceType/ogc/> 
      PREFIX org: <http://www.w3.org/ns/org#> 
      PREFIX owl: <http://www.w3.org/2002/07/owl#> 
      PREFIX pav: <http://purl.org/pav/> 
      PREFIX r3d: <http://www.re3data.org/schema/4-0> 
      PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> 
      PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#> 
      PREFIX schema: <http://schema.org/> 
      PREFIX sf: <http://www.opengis.net/ont/sf#> 
      PREFIX skos: <http://www.w3.org/2004/02/skos/core#> 
      PREFIX vann: <http://purl.org/vocab/vann/> 
      PREFIX vcard: <http://www.w3.org/2006/vcard/ns#> 
      PREFIX wde: <http://www.wikidata.org/entity/> 
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#> 
    </prefix_declaration>

  CoT_instruction: |
    <CoT_instruction>
      - Let's think step by step.
    </CoT_instruction>
    
  query_constraint: |
    <query_constraint>
        - When identifying or counting the attributes available for instances of a type, rdf:type must not be considered an attribute. Always exclude the type predicate from the results by adding:
          FILTER(?predicate != rdf:type)
        - When using UNION in a SPARQL query, explicitly group each alternative graph pattern with {{ ... }}. UNION operates on graph patterns, so each branch must be enclosed in its own group.
    </query_constraint>

  aggregation_principles: |
 

  other_functions: |
 

  measurement_units: |
    

  graph_constraints: |
    <graph_constraints>
      - When a question asks for all attributes available for a given type, determine the attributes from the actual RDF data,
        not from the ontology or from properties that are merely applicable to that type. The SPARQL query must therefore inspect instances of the requested type and return the predicates that actually occur for those instances.
      - When a question asks which attributes are available for a type or how many attributes are available for a type, interpret “available attributes” as the distinct predicates that actually occur on instances of that type in the RDF data.
      - For listing questions, return the distinct predicates actually used by instances of the type:
      - For counting questions, count those distinct predicates directly
    </graph_constraints>
  concept_mapping: |
      
  concept_definition: |


user_message: |
   Answer the following question using the provided schema context.

prompt: instructional
